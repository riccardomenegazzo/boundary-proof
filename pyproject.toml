[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-proof"
version = "0.1.0"
description = "Evidence-driven permission evaluation for AI workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Riccardo Menegazzo"}]
dependencies = []

[project.scripts]
boundary-proof = "boundary_proof.cli:main"

[tool.setuptools.packages.find]
include = ["boundary_proof*"]
